<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ICM CMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="cms-body">
    <header class="cms-topbar">
      <a class="cms-brand" href="./index.html">
        <img src="./public/images/icm-logo-provided-transparent.png" alt="Islamic Center of Morrisville">
      </a>
      <nav>
        <a href="./index.html" target="_blank" rel="noopener">View website</a>
        <button type="button" data-action="reload" data-editor-action data-content-action hidden>Reload draft</button>
        <button type="button" data-action="save" data-editor-action data-content-action hidden>Save draft</button>
        <button class="cms-save" type="button" data-action="publish" data-editor-action data-content-action hidden>Publish to website + app</button>
        <button type="button" data-action="logout" data-editor-action hidden>Sign out</button>
      </nav>
    </header>

    <main class="cms-shell">
      <section class="cms-intro">
        <div>
          <h1>ICM content manager</h1>
          <p>Edit once, then publish the same information to the website and mobile app.</p>
        </div>
        <p class="cms-status" data-status role="status" aria-live="polite">Loading content...</p>
      </section>

      <div data-cms-app></div>
    </main>

    <script type="module" src="./public/app/admin.js"></script>
  </body>
</html>
